name: Open Code Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PR_NUMBER: ${{ github.event.pull_request.number }}
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  BASE_REF: ${{ github.event.pull_request.base.ref }}

jobs:
  review:
    if: ${{ github.event.pull_request.head.repo.fork == false && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      pull-requests: read
    outputs:
      review: ${{ steps.project.outputs.review }}
    steps:
      - name: Check configuration
        id: config
        env:
          OCR_LLM_URL: ${{ secrets.OCR_LLM_URL }}
          OCR_LLM_AUTH_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OCR_LLM_MODEL: ${{ vars.OCR_LLM_MODEL }}
          OCR_LLM_PROTOCOL: ${{ vars.OCR_LLM_PROTOCOL || 'openai' }}
          OCR_EFFORT: ${{ vars.OCR_EFFORT || 'medium' }}
          OCR_LANGUAGE: ${{ vars.OCR_LANGUAGE || 'Portuguese' }}
        run: |
          if ! test -n "$OCR_LLM_URL" || ! test -n "$OCR_LLM_AUTH_TOKEN" || ! test -n "$OCR_LLM_MODEL"; then
            echo 'Open Code Review: configuration unavailable; skipping.'
            exit 0
          fi
          if [[ "$BASE_REF" != main || ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ || ! "$PR_NUMBER" =~ ^[1-9][0-9]{0,8}$ || ! "$OCR_LLM_PROTOCOL" =~ ^(openai|openai-responses|anthropic)$ || ! "$OCR_EFFORT" =~ ^(low|medium|high)$ || ! "$OCR_LANGUAGE" =~ ^(Portuguese|English)$ || "$OCR_LLM_URL" != https://* ]]; then
            echo 'Open Code Review: invalid configuration or event.'
            exit 1
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.config.outputs.ready == 'true'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Check trusted base
        if: steps.config.outputs.ready == 'true'
        id: trusted
        run: |
          if [ ! -f tools/ci-code-review.py ]; then
            echo 'Open Code Review: reviewer not installed on the base; skipping.'
            exit 0
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Verify current pull request
        if: steps.trusted.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I tools/ci-code-review.py preflight
      - name: Fetch review inputs and verify binary
        if: steps.trusted.outputs.ready == 'true'
        timeout-minutes: 2
        run: |
          umask 077
          work="$RUNNER_TEMP/mexerica-ocr"
          mkdir -- "$work"
          if ! (
            set -o pipefail
            test "$(git rev-parse HEAD)" = "$BASE_SHA" &&
            git -c gc.auto=0 fetch --no-tags --no-recurse-submodules origin "refs/pull/$PR_NUMBER/head" &&
            test "$(git rev-parse --verify 'FETCH_HEAD^{commit}')" = "$HEAD_SHA" &&
            merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")" &&
            [[ "$merge_base" =~ ^[0-9a-f]{40}$ ]] &&
            diff_bytes="$(git diff --no-ext-diff --no-textconv "$merge_base" "$HEAD_SHA" -- | head -c 262145 | wc -c)" &&
            test "$diff_bytes" -le 262144 &&
            printf '%s\n' "$merge_base" > "$work/merge-base" &&
            curl --fail --silent --location --proto '=https' --proto-redir '=https' --max-time 45 --max-filesize 67108864 https://github.com/alibaba/open-code-review/releases/download/v1.14.0/opencodereview-linux-amd64 -o "$work/ocr" &&
            printf '%s  %s\n' 3faf877bb78720269dd215215ab7cf4741bf188e163b8f18012cbe2d3ba3037d "$work/ocr" | sha256sum --check --status &&
            chmod 700 "$work/ocr"
          ) > /dev/null 2>&1; then
            echo 'Open Code Review: could not verify inputs.'
            exit 1
          fi
      - name: Review diff
        if: steps.trusted.outputs.ready == 'true'
        env:
          OCR_LLM_URL: ${{ secrets.OCR_LLM_URL }}
          OCR_LLM_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OCR_LLM_MODEL: ${{ vars.OCR_LLM_MODEL }}
          OCR_LLM_PROTOCOL: ${{ vars.OCR_LLM_PROTOCOL || 'openai' }}
          OCR_EFFORT: ${{ vars.OCR_EFFORT || 'medium' }}
          OCR_LANGUAGE: ${{ vars.OCR_LANGUAGE || 'Portuguese' }}
        run: |
          umask 077
          work="$RUNNER_TEMP/mexerica-ocr"
          private_home="$work/profile"
          mkdir -- "$private_home" "$private_home/.opencodereview" "$work/tmp"
          printf '{"language":"%s","telemetry":{"enabled":false}}\n' "$OCR_LANGUAGE" > "$private_home/.opencodereview/config.json"
          if ! (
            ulimit -f 4096 || exit 1
            exec timeout --kill-after=5s 240s env -i HOME="$private_home" TMPDIR="$work/tmp" PATH=/usr/bin:/bin \
              GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null OCR_NO_UPDATE=1 \
              OCR_LLM_URL="$OCR_LLM_URL" OCR_LLM_TOKEN="$OCR_LLM_TOKEN" OCR_LLM_MODEL="$OCR_LLM_MODEL" \
              OCR_LLM_PROTOCOL="$OCR_LLM_PROTOCOL" OCR_LLM_TIMEOUT=25 \
              "$work/ocr" review --from "$(<"$work/merge-base")" --to "$HEAD_SHA" \
              --audience agent --format json --effort "$OCR_EFFORT" --concurrency 1 --timeout 2 --max-tokens-budget 20000
          ) > "$work/result.json" 2> "$work/stderr.log"; then
            echo 'Open Code Review: review unavailable.'
            exit 1
          fi
      - name: Validate review output
        if: steps.trusted.outputs.ready == 'true'
        id: project
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I tools/ci-code-review.py project
      - name: Remove review files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mexerica-ocr"

  publish:
    needs: review
    if: ${{ github.event.pull_request.head.repo.fork == false && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false && needs.review.outputs.review != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Publish verified findings
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW: ${{ needs.review.outputs.review }}
        run: python3 -I tools/ci-code-review.py publish
