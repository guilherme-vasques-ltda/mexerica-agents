name: Open Code Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PR_NUMBER: ${{ github.event.pull_request.number }}
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  BASE_REF: ${{ github.event.pull_request.base.ref }}

jobs:
  review:
    if: ${{ github.event.pull_request.head.repo.fork == false && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ready: ${{ steps.upload.outcome == 'success' }}
    steps:
      - name: Prepare and verify filesystem isolation
        timeout-minutes: 2
        shell: bash
        run: |
          if ! command -v bwrap > /dev/null; then
            sudo -n apt-get update -qq > /dev/null 2>&1
            sudo -n apt-get install -y -qq bubblewrap > /dev/null 2>&1
          fi
          work=$(mktemp -d)
          trap 'rm -rf -- "$work"' EXIT
          mkdir -- "$work/tmp" "$work/profile" "$work/repo"
          probe() {
            timeout --kill-after=2s 8s /usr/bin/bwrap --unshare-all --share-net --die-with-parent --cap-drop ALL \
              --clearenv --ro-bind /usr /usr --symlink usr/lib /lib --symlink usr/lib64 /lib64 --symlink usr/bin /bin \
              --ro-bind /etc/ssl/certs /etc/ssl/certs --ro-bind /etc/resolv.conf /etc/resolv.conf --ro-bind /etc/hosts /etc/hosts \
              --proc /proc --dev /dev --bind "$work/tmp" /tmp --bind "$work/profile" /profile \
              --ro-bind "$work/repo" /review --chdir /review \
              --setenv HOME /profile --setenv TMPDIR /tmp --setenv PATH /usr/bin:/bin \
              /usr/bin/bash -ec 'test "$PWD" = /review && test -z "${GITHUB_WORKSPACE+x}" && grep -Eq "^CapEff:[[:space:]]+0+$" /proc/self/status && ! touch /review/marker 2>/dev/null && touch /tmp/marker' \
              > /dev/null 2> "$work/probe.log"
          }
          if probe && test -f "$work/tmp/marker"; then
            echo 'Open Code Review: sandbox starts under the default policy.'
            exit 0
          fi
          if ! grep -Eq 'No permissions to create a new namespace|Operation not permitted|Permission denied' "$work/probe.log" ||
             ! test "${RUNNER_ENVIRONMENT:-}" = github-hosted ||
             ! test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1 ||
             ! test "$(stat -Lc '%u:%g:%a' /usr/bin/bwrap)" = 0:0:755; then
            echo 'Open Code Review: isolation unavailable.'
            exit 1
          fi
          cat > "$work/bwrap.profile" <<'EOF'
          abi <abi/4.0>,
          profile ocr-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          EOF
          if ! sudo -n apparmor_parser -a "$work/bwrap.profile" > /dev/null 2>&1; then
            echo 'Open Code Review: scoped sandbox profile could not be loaded.'
            exit 1
          fi
          trap 'sudo -n apparmor_parser -R "$work/bwrap.profile" >/dev/null 2>&1; rm -rf -- "$work"' EXIT
          if ! probe || ! test -f "$work/tmp/marker"; then
            echo 'Open Code Review: sandbox failed with the scoped profile.'
            exit 1
          fi
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
          install -m 600 -- "$work/bwrap.profile" "$RUNNER_TEMP/mexerica-ocr-bwrap.profile"
          trap 'rm -rf -- "$work"' EXIT
          echo 'Open Code Review: scoped profile enables the sandbox with global protection unchanged.'
      - name: Check for masked model configuration
        id: model
        env:
          OCR_LLM_MODEL: ${{ secrets.OCR_LLM_MODEL }}
        run: |
          if [ -z "$OCR_LLM_MODEL" ]; then
            echo 'Open Code Review: configuration unavailable; skipping.'
            exit 0
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Check configuration
        id: config
        if: steps.model.outputs.ready == 'true'
        env:
          OCR_LLM_URL: ${{ secrets.OCR_LLM_URL }}
          OCR_LLM_AUTH_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OCR_LLM_PROTOCOL: ${{ (vars.OCR_LLM_PROTOCOL == '' || vars.OCR_LLM_PROTOCOL == 'openai') && 'openai' || vars.OCR_LLM_PROTOCOL == 'openai-responses' && 'openai-responses' || vars.OCR_LLM_PROTOCOL == 'anthropic' && 'anthropic' || 'invalid' }}
          OCR_EFFORT: ${{ vars.OCR_EFFORT || 'medium' }}
          OCR_LANGUAGE: ${{ vars.OCR_LANGUAGE || 'Portuguese' }}
          OCR_MAX_TOKENS_BUDGET: ${{ vars.OCR_MAX_TOKENS_BUDGET || '500000' }}
        run: |
          if ! test -n "$OCR_LLM_URL" || ! test -n "$OCR_LLM_AUTH_TOKEN"; then
            echo 'Open Code Review: configuration unavailable; skipping.'
            exit 0
          fi
          if [[ "$BASE_REF" != main || ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ || ! "$PR_NUMBER" =~ ^[1-9][0-9]{0,8}$ || ! "$OCR_LLM_PROTOCOL" =~ ^(openai|openai-responses|anthropic)$ || ! "$OCR_EFFORT" =~ ^(low|medium|high)$ || ! "$OCR_LANGUAGE" =~ ^(Portuguese|English)$ || "$OCR_LLM_URL" != https://* ]]; then
            echo 'Open Code Review: invalid configuration or event.'
            exit 1
          fi
          if [[ ! "$OCR_MAX_TOKENS_BUDGET" =~ ^[1-9][0-9]{0,6}$ ]] || (( OCR_MAX_TOKENS_BUDGET > 2000000 )); then
            echo 'Open Code Review: invalid budget.'
            exit 1
          fi
          printf 'ready=true\nprotocol=%s\n' "$OCR_LLM_PROTOCOL" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.config.outputs.ready == 'true'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Check trusted base
        if: steps.config.outputs.ready == 'true'
        id: trusted
        run: |
          if ! grep -Fq "if mode == 'validate-provider':" tools/ci-code-review.py; then
            echo 'Open Code Review: reviewer with model redaction not installed on the base; skipping.'
            exit 0
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Verify current pull request
        if: steps.trusted.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I tools/ci-code-review.py preflight
      - name: Fetch review inputs and verify binary
        if: steps.trusted.outputs.ready == 'true'
        timeout-minutes: 2
        run: |
          umask 077
          work="$RUNNER_TEMP/mexerica-ocr"
          mkdir -- "$work"
          if ! (
            set -o pipefail
            test "$(git rev-parse HEAD)" = "$BASE_SHA" &&
            git init --template= "$work/repo" &&
            git -C "$work/repo" fetch --no-tags --no-recurse-submodules "$GITHUB_WORKSPACE" "$BASE_SHA" &&
            git -C "$work/repo" update-ref --no-deref HEAD "$BASE_SHA" &&
            git -C "$work/repo" -c gc.auto=0 fetch --no-tags --no-recurse-submodules "https://github.com/$GITHUB_REPOSITORY.git" "refs/pull/$PR_NUMBER/head" &&
            test "$(git -C "$work/repo" rev-parse --verify 'FETCH_HEAD^{commit}')" = "$HEAD_SHA" &&
            merge_base="$(git -C "$work/repo" merge-base "$BASE_SHA" "$HEAD_SHA")" &&
            [[ "$merge_base" =~ ^[0-9a-f]{40}$ ]] &&
            diff_bytes="$(git -C "$work/repo" diff --no-ext-diff --no-textconv "$merge_base" "$HEAD_SHA" -- | head -c 262145 | wc -c)" &&
            test "$diff_bytes" -le 262144 &&
            printf '%s\n' "$merge_base" > "$work/merge-base" &&
            curl --fail --silent --location --proto '=https' --proto-redir '=https' --max-time 45 --max-filesize 67108864 https://github.com/alibaba/open-code-review/releases/download/v1.14.0/opencodereview-linux-amd64 -o "$work/ocr" &&
            printf '%s  %s\n' 3faf877bb78720269dd215215ab7cf4741bf188e163b8f18012cbe2d3ba3037d "$work/ocr" | sha256sum --check --status &&
            chmod 700 "$work/ocr"
          ) > /dev/null 2>&1; then
            echo 'Open Code Review: could not verify inputs.'
            exit 1
          fi
      - name: Review diff
        if: steps.trusted.outputs.ready == 'true'
        timeout-minutes: 9
        env:
          OCR_LLM_URL: ${{ secrets.OCR_LLM_URL }}
          OCR_LLM_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OCR_LLM_MODEL: ${{ secrets.OCR_LLM_MODEL }}
          OCR_LLM_PROTOCOL: ${{ steps.config.outputs.protocol }}
          OCR_EFFORT: ${{ vars.OCR_EFFORT || 'medium' }}
          OCR_LANGUAGE: ${{ vars.OCR_LANGUAGE || 'Portuguese' }}
          OCR_MAX_TOKENS_BUDGET: ${{ vars.OCR_MAX_TOKENS_BUDGET || '500000' }}
        run: |
          umask 077
          python3 -I tools/ci-code-review.py validate-provider
          work="$RUNNER_TEMP/mexerica-ocr"
          private_home="$work/profile"
          mkdir -- "$private_home" "$private_home/.opencodereview" "$work/tmp"
          printf '{"language":"%s","telemetry":{"enabled":false}}\n' "$OCR_LANGUAGE" > "$private_home/.opencodereview/config.json"
          { if (
            ulimit -f 4096 || exit 1
            exec timeout --kill-after=5s 480s /usr/bin/bwrap --unshare-all --share-net --die-with-parent --cap-drop ALL \
              --clearenv --ro-bind /usr /usr --symlink usr/lib /lib --symlink usr/lib64 /lib64 --symlink usr/bin /bin \
              --ro-bind /etc/ssl/certs /etc/ssl/certs --ro-bind /etc/resolv.conf /etc/resolv.conf --ro-bind /etc/hosts /etc/hosts \
              --proc /proc --dev /dev --bind "$work/tmp" /tmp --bind "$private_home" /profile \
              --ro-bind "$work/repo" /review --ro-bind "$work/ocr" /ocr --chdir /review \
              --setenv HOME /profile --setenv TMPDIR /tmp --setenv PATH /usr/bin:/bin \
              --setenv GIT_CONFIG_NOSYSTEM 1 --setenv GIT_CONFIG_GLOBAL /dev/null --setenv OCR_NO_UPDATE 1 \
              --setenv OCR_LLM_URL "$OCR_LLM_URL" --setenv OCR_LLM_TOKEN "$OCR_LLM_TOKEN" --setenv OCR_LLM_MODEL "$OCR_LLM_MODEL" \
              --setenv OCR_LLM_PROTOCOL "$OCR_LLM_PROTOCOL" --setenv OCR_LLM_TIMEOUT 25 \
              /ocr review --from "$(<"$work/merge-base")" --to "$HEAD_SHA" \
              --audience agent --format json --effort "$OCR_EFFORT" --concurrency 1 --timeout 2 --max-tokens-budget "$OCR_MAX_TOKENS_BUDGET"
          ) > "$work/result.json" 2> "$work/stderr.log"; then
            :
          else
            status=$?
            if [ "$status" -eq 124 ]; then
              category='Prazo'
            elif [ "$status" -ge 129 ] && [ "$status" -le 192 ]; then
              category='Sinal'
            else
              category='Saida'
            fi
            echo "Open Code Review: $category."
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              { printf '%s\n' "Open Code Review: $category." >> "$GITHUB_STEP_SUMMARY"; } 2>/dev/null || true
            fi
            echo 'Open Code Review: review unavailable.'
            exit 1
          fi
          } 2>/dev/null
      - name: Validate review output
        if: steps.trusted.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OCR_LLM_URL: ${{ secrets.OCR_LLM_URL }}
          OCR_LLM_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OCR_LLM_MODEL: ${{ secrets.OCR_LLM_MODEL }}
        run: umask 077; python3 -I tools/ci-code-review.py project
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        if: steps.trusted.outputs.ready == 'true'
        with:
          name: ocr-projection-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mexerica-ocr/review.json
          if-no-files-found: error
          retention-days: 1
      - name: Remove review files
        if: always()
        timeout-minutes: 1
        run: rm -rf -- "$RUNNER_TEMP/mexerica-ocr"
      - name: Remove scoped isolation profile
        if: always()
        timeout-minutes: 1
        run: |
          profile="$RUNNER_TEMP/mexerica-ocr-bwrap.profile"
          if [ -f "$profile" ]; then
            if ! sudo -n apparmor_parser -R "$profile" > /dev/null 2>&1; then
              echo 'Open Code Review: could not remove scoped profile.'
              exit 1
            fi
            rm -f -- "$profile"
          fi

  publish:
    needs: review
    if: ${{ github.event.pull_request.head.repo.fork == false && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false && needs.review.outputs.ready == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Download filtered findings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          destination="$RUNNER_TEMP/mexerica-ocr-publish"
          mkdir -- "$destination"
          if ! gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "ocr-projection-$GITHUB_RUN_ATTEMPT" --dir "$destination" > /dev/null 2>&1; then
            echo 'Open Code Review: filtered findings unavailable.'
            exit 1
          fi
      - name: Publish verified findings
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I tools/ci-code-review.py publish
      - name: Remove downloaded projection
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mexerica-ocr-publish"
