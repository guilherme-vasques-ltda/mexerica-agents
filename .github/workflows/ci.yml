# CI do mexerica-agents: roda so em runners Boat e Instabox, nunca em runner hospedado pelo GitHub.
# O job ci-ok junta tudo e e a checagem obrigatoria da main. Guia: docs/guides/ci.md.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Boat primeiro, Instabox quando o Boat recusa por limite. A sonda pede um start ao Boat;
  # o route so manda a rodada ao Boat se o passo "Set up runner" da sonda passou.
  boat-probe:
    if: ${{ github.run_attempt == 1 && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: boat-small
    continue-on-error: true
    timeout-minutes: 2
    permissions: {}
    steps:
      - run: echo "Boat aceitou o start"

  route:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: instabox-small
    timeout-minutes: 3
    permissions:
      actions: read
    outputs:
      family: ${{ steps.pick.outputs.family }}
      light: ${{ steps.pick.outputs.light }}
      medium: ${{ steps.pick.outputs.medium }}
      heavy: ${{ steps.pick.outputs.heavy }}
    steps:
      - name: Escolher Boat ou Instabox
        id: pick
        env:
          ATTEMPT: ${{ github.run_attempt }}
          GH_TOKEN: ${{ github.token }}
          JOBS_URL: ${{ github.api_url }}/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?filter=latest&per_page=100
        run: |
          family=instabox
          # Nova tentativa vai direto para a Instabox, sem outra sonda.
          while [ "$ATTEMPT" = 1 ] && [ "$SECONDS" -lt 60 ]; do
            rest=$((60 - SECONDS))
            probe=$(curl -fsS --max-time $((rest < 10 ? rest : 10)) -H "Authorization: Bearer $GH_TOKEN" "$JOBS_URL" | jq -r '.jobs[] | select(.name == "boat-probe") | if .conclusion == "success" or ([.steps[]? | select(.name == "Set up runner" and .conclusion == "success")] | length > 0) then "ok" elif .status == "completed" then "no" else "wait" end') || probe=""
            case "$probe" in
              ok) family=boat; break ;;
              no) break ;;
              *) rest=$((60 - SECONDS)); [ "$rest" -ge 1 ] || break; sleep $((rest < 3 ? rest : 3)) ;;
            esac
          done
          case "$family" in
            boat) light=boat-small; medium=boat; heavy=boat-large ;;
            *) light=instabox-small; medium=instabox-medium; heavy=instabox-large ;;
          esac
          printf 'family=%s\nlight=%s\nmedium=%s\nheavy=%s\n' "$family" "$light" "$medium" "$heavy" >> "$GITHUB_OUTPUT"
          printf 'Rota do CI: %s\n' "$family" >> "$GITHUB_STEP_SUMMARY"

  secrets:
    needs: route
    runs-on: ${{ github.run_attempt == 1 && needs.route.outputs.light || 'instabox-small' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
      - name: Instalar Gitleaks 8.30.1 com SHA256 fixo
        run: |
          curl --fail --silent --show-error --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Bloquear segredos novos sem imprimir valores
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          trusted_main=$(git rev-parse refs/remotes/origin/main)
          source="$trusted_main"
          if ! git cat-file -e "$trusted_main:tools/ci-gitleaks.mjs" 2>/dev/null; then
            # Somente no PR que introduz o executor: a main ainda nao o tem.
            test "$GITHUB_EVENT_NAME" = pull_request
            [[ "$PR_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
            source="$PR_HEAD_SHA"
          fi
          git show "$source:tools/ci-gitleaks.mjs" > "$RUNNER_TEMP/trusted-ci-gitleaks.mjs"
          GITLEAKS_TRUSTED_MAIN_SHA="$trusted_main" node "$RUNNER_TEMP/trusted-ci-gitleaks.mjs"

  vazamento:
    needs: [route, secrets]
    runs-on: ${{ github.run_attempt == 1 && needs.route.outputs.light || 'instabox-small' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
      - name: Escolher a fonte do executor de vazamento
        id: fonte
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          trusted_main=$(git rev-parse refs/remotes/origin/main)
          source="$trusted_main"
          inicial=false
          if ! git cat-file -e "$trusted_main:tools/ci-vazamento.mjs" 2>/dev/null; then
            # Somente no PR que introduz o executor e a politica, nunca depois.
            test "$GITHUB_EVENT_NAME" = pull_request
            [[ "$PR_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
            if git cat-file -e "$trusted_main:.github/security/vazamento.json" 2>/dev/null; then exit 1; fi
            if git cat-file -e "$trusted_main:.github/security/vazamento-inventario.json" 2>/dev/null; then exit 1; fi
            source="$PR_HEAD_SHA"
            inicial=true
          fi
          git show "$source:tools/ci-vazamento.mjs" > "$RUNNER_TEMP/trusted-ci-vazamento.mjs"
          printf 'trusted_main=%s\ninicial=%s\n' "$trusted_main" "$inicial" >> "$GITHUB_OUTPUT"
      # O secret so chega ao executor vindo da main, nunca a codigo do PR.
      - name: Verificar linhas novas e mensagens sem imprimir conteudo
        if: ${{ steps.fonte.outputs.inicial == 'false' }}
        env:
          VAZAMENTO_TERMOS: ${{ secrets.VAZAMENTO_TERMOS }}
          VAZAMENTO_TRUSTED_MAIN_SHA: ${{ steps.fonte.outputs.trusted_main }}
        run: node "$RUNNER_TEMP/trusted-ci-vazamento.mjs" pr
      # Instalacao inicial: o executor vem do PR, entao roda so com regras publicas e sem o secret.
      - name: Verificar com regras publicas (instalacao inicial, sem termos pessoais)
        if: ${{ steps.fonte.outputs.inicial != 'false' }}
        env:
          VAZAMENTO_TRUSTED_MAIN_SHA: ${{ steps.fonte.outputs.trusted_main }}
        run: node "$RUNNER_TEMP/trusted-ci-vazamento.mjs" pr

  # Informativo: falha de auditoria aparece no PR, mas nao entra no ci-ok.
  dependency-audit:
    needs: [route, secrets]
    runs-on: ${{ github.run_attempt == 1 && needs.route.outputs.light || 'instabox-small' }}
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
      - name: Instalar cargo-audit 0.22.2 com SHA256 fixo
        run: |
          curl --fail --silent --show-error --location --retry 3 https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.22.2/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2.tgz -o "$RUNNER_TEMP/cargo-audit.tgz"
          echo "ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39  $RUNNER_TEMP/cargo-audit.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/cargo-audit.tgz" -C "$RUNNER_TEMP"
      - name: npm audit high e cargo audit (somente aviso)
        env:
          CARGO_AUDIT_BIN: ${{ runner.temp }}/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2/cargo-audit
        run: node tools/ci-security-audit.mjs

  # Achados informativos; a analise precisa concluir. Manifesto e regras vem da main.
  semgrep:
    needs: [route, secrets]
    runs-on: ${{ github.run_attempt == 1 && needs.route.outputs.light || 'instabox-small' }}
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      SEMGREP_SEND_METRICS: 'off'
      SEMGREP_ENABLE_VERSION_CHECK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Copiar manifesto e regras do Semgrep da main
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          trusted_main=$(git rev-parse refs/remotes/origin/main)
          source="$trusted_main"
          if ! git cat-file -e "$trusted_main:.github/security/semgrep.yml" 2>/dev/null; then
            # Somente no PR que introduz o Semgrep: a main ainda nao tem a politica.
            test "$GITHUB_EVENT_NAME" = pull_request
            [[ "$PR_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
            source="$PR_HEAD_SHA"
          fi
          mkdir -p "$RUNNER_TEMP/semgrep-politica"
          git show "$source:.github/security/semgrep.yml" > "$RUNNER_TEMP/semgrep-politica/semgrep.yml"
          git show "$source:.github/security/semgrep-requirements.txt" > "$RUNNER_TEMP/semgrep-politica/requirements.txt"
      - name: Validar plataforma e instalar Semgrep OSS fixado
        run: |
          . /etc/os-release
          test "$ID" = ubuntu && test "$VERSION_ID" = 24.04
          test "$(uname -m)" = x86_64
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12)'
          python3 -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/pip" --disable-pip-version-check install --only-binary=:all: --require-hashes -r "$RUNNER_TEMP/semgrep-politica/requirements.txt"
      - name: Executar Semgrep (achados informativos, falha bloqueante)
        run: |
          "$RUNNER_TEMP/semgrep-venv/bin/semgrep" scan --config "$RUNNER_TEMP/semgrep-politica/semgrep.yml" --metrics=off --disable-version-check --jobs 2 --exclude '*.lock' --exclude '*-lock.json' --exclude '*.svg' --exclude '*.min.js' --exclude xterm.js --json --output "$RUNNER_TEMP/semgrep.json" > "$RUNNER_TEMP/semgrep.log" 2>&1
          python3 - <<'PYTHON'
          import json, os
          with open(os.environ['RUNNER_TEMP'] + '/semgrep.json') as f:
              data = json.load(f)
          rows = [dict(arquivo=r['path'], linha=r['start']['line'], regra=r['check_id']) for r in data['results']]
          for row in rows:
              print(json.dumps(row))
          summary = f"Semgrep OSS: {len(rows)} ocorrencia(s), {len(data.get('errors', []))} erro(s) de analise. Achados sao informativos."
          print('::warning::' + summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(summary + '\n\n' + '\n'.join(json.dumps(row) for row in rows) + '\n')
          if data.get('errors'):
              print('::error::Semgrep nao concluiu a analise; os achados continuam informativos.')
              raise SystemExit(1)
          PYTHON

  changes:
    needs: [route, secrets]
    runs-on: ${{ github.run_attempt == 1 && needs.route.outputs.light || 'instabox-small' }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      host: ${{ steps.selection.outputs.host }}
      desktop: ${{ steps.selection.outputs.desktop }}
      heavy: ${{ steps.selection.outputs.heavy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Selecionar alvos pelo diff entre a main e o merge do PR
        id: selection
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          read -r -a parents <<< "$(git show -s --format=%P HEAD)"
          [[ ${#parents[@]} == 2 && "${parents[1]}" == "$PR_HEAD_SHA" ]]
          # Diff gravado antes: se o git falhar, o passo reprova em vez de publicar selecao vazia.
          git diff --name-only --no-renames -z "${parents[0]}" HEAD > "$RUNNER_TEMP/alterados.z"
          host=false
          desktop=false
          while IFS= read -r -d '' path; do
            case "$path" in
              .github/*|tools/ci-*) host=true; desktop=true ;;
            esac
            # Hub: codigo, motor, toolchain e arquivos de outras pastas lidos pelos testes do Hub.
            case "$path" in
              host/*|motor/*|apps/screen-linux/*|rust-toolchain.toml|Cargo.toml|Cargo.lock|.cargo/*|rustfmt.toml|.rustfmt.toml|clippy.toml|.clippy.toml|docs/features/manual-do-harness.md|docs/reference/fixtures/remote-relay-vectors.json) host=true ;;
              apps/desktop/src/renderer/lib/donnabot-avatars/schema/avatar-config.schema.json|apps/desktop/src/renderer/lib/donnabot-avatars/presets/roles.json) host=true ;;
              apps/desktop/src/shared/fork-avatar-data.json|apps/desktop/src/shared/fork-mexeriquinha-data.json|apps/desktop/src/shared/fork-mexeriquinha.schema.json|apps/desktop/src/shared/fork-mexeriquinha-wire-fixture.json) host=true ;;
              apps/desktop/src/renderer/lib/mexeriquinhas/prompts/*|apps/desktop/src/renderer/lib/mexeriquinhas/assets/base/referencia.png) host=true ;;
            esac
            # Desktop: os testes leem arquivos de varias pastas; so mudancas exclusivas de Hub e motor dispensam.
            case "$path" in
              host/src/fork/skill_catalog/registry.json|host/src/fork/personal_link/*) desktop=true ;;
              host/*|motor/*|apps/screen-linux/*) ;;
              *) desktop=true ;;
            esac
          done < "$RUNNER_TEMP/alterados.z"
          heavy=true
          [ "$DRAFT" != true ] || heavy=false
          printf 'host=%s\ndesktop=%s\nheavy=%s\n' "$host" "$desktop" "$heavy" >> "$GITHUB_OUTPUT"
          printf 'Selecao: host=%s desktop=%s heavy=%s\n' "$host" "$desktop" "$heavy" >> "$GITHUB_STEP_SUMMARY"

  ferramentas-ci:
    needs: [route, secrets]
    runs-on: ${{ github.run_attempt == 1 && needs.route.outputs.light || 'instabox-small' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
      - name: Instalar Gitleaks 8.30.1 para testar o executor sem secrets
        run: |
          curl --fail --silent --show-error --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Testar executores e contrato do workflow em VM sem secrets
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
        run: node --test tools/ci-gitleaks.test.mjs tools/ci-vazamento.test.mjs tools/ci-workflow.test.mjs tools/ci-bastidor.test.mjs

  hub:
    needs: [route, changes]
    if: ${{ needs.changes.outputs.host == 'true' && needs.changes.outputs.heavy == 'true' }}
    runs-on: ${{ github.run_attempt == 1 && needs.route.outputs.heavy || 'instabox-large' }}
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: motor/package-lock.json
      # Os testes do Hub lancam motor/mexerica/rpc.ts: o motor precisa das dependencias.
      - name: Verificar o motor (typecheck e testes Node)
        working-directory: motor
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
      # O rustup le o rust-toolchain.toml da raiz e instala a versao fixada com clippy e rustfmt.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: host
          key: hub
      - name: Instalar cargo-nextest 0.9.152 com SHA256 fixo
        run: |
          curl --fail --silent --show-error --location --retry 3 https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.152/cargo-nextest-0.9.152-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/nextest.tar.gz"
          echo "d039b43c3e0958441b6ad0a39c8884d018b3d2e8fb9928f209074b1100b5e17a  $RUNNER_TEMP/nextest.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/nextest.tar.gz" -C "$RUNNER_TEMP/bin" cargo-nextest
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Sem bubblewrap os testes reais de isolamento nao rodariam; MEXERICA_EXIGIR_BWRAP faz o job reprovar.
      - name: Garantir bubblewrap para os testes reais de isolamento
        run: |
          if ! command -v bwrap > /dev/null; then
            if [ "$(id -u)" = 0 ]; then apt-get update -qq && apt-get install -y -qq bubblewrap; else sudo -n apt-get update -qq && sudo -n apt-get install -y -qq bubblewrap; fi
          fi
          bwrap --version
      - name: Formatar e conferir o Hub (fmt e Clippy)
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Executar toda a suite do Hub (nextest)
        env:
          # Sem Node/entrypoint os testes do motor reprovam em vez de pular.
          MEXERICA_MOTOR_TESTS_REQUIRED: '1'
          # Isolamento real (bwrap) nunca pode ser pulado em silencio.
          MEXERICA_EXIGIR_BWRAP: '1'
        run: |
          # Quando o bwrap nao monta /proc direto na VM, os mesmos testes rodam como o mesmo usuario num
          # namespace de PIDs/montagem novo com /proc limpo; nada e afrouxado.
          cmd=(cargo nextest run --workspace --locked --test-threads num-cpus --no-fail-fast)
          if ! bwrap --unshare-all --ro-bind / / --proc /proc --dev /dev true 2> /dev/null; then
            echo "bwrap nao monta /proc direto nesta VM; rodando os testes em namespace novo com /proc limpo"
            uid=$(/usr/bin/id -u); gid=$(/usr/bin/id -g)
            [ "$uid" != 0 ] || { echo '::error::o runner ja e root: nao ha UID para onde largar o privilegio'; exit 1; }
            for bin in sudo unshare setpriv env bash; do [ -x "/usr/bin/$bin" ] || { echo "::error::/usr/bin/$bin ausente"; exit 1; }; done
            cmd=(/usr/bin/sudo -n /usr/bin/unshare -m -p -f --mount-proc /usr/bin/setpriv "--reuid=$uid" "--regid=$gid" --init-groups /usr/bin/env "PATH=$PATH" "HOME=$HOME" "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" MEXERICA_MOTOR_TESTS_REQUIRED=1 MEXERICA_EXIGIR_BWRAP=1 /usr/bin/bash -c '"$@" & wait $!' reaper "${cmd[@]}")
          fi
          time "${cmd[@]}"
      - name: Doctests do Hub
        run: cargo test --workspace --doc --locked
      # Prova de dois UIDs do Motor Mexerica: nunca pula. Sem sudo -n o job reprova.
      - name: Prova de dois UIDs do Motor Mexerica (ajudante real, VM descartavel)
        run: |
          set -euo pipefail
          sudo -n true || { echo '::error::sudo -n indisponivel: a prova de dois UIDs do motor nao pode rodar'; exit 1; }
          cargo build --locked --bin donnabot-motor-exec
          tests=$(cargo test --locked --no-run --bin donnabot-host --message-format=json | jq -r 'select(.executable != null and .profile.test == true) | .executable' | tail -n 1)
          test -x "$tests"
          sudo -n env "PATH=$PATH" python3 tests/motor_mexerica_ci.py "$PWD/target/debug/donnabot-motor-exec" "$tests" --vm-descartavel

  desktop:
    needs: [route, changes]
    if: ${{ needs.changes.outputs.desktop == 'true' && needs.changes.outputs.heavy == 'true' }}
    runs-on: ${{ github.run_attempt == 1 && needs.route.outputs.medium || 'instabox-medium' }}
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/desktop
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # O gate de textos compara com a base do evento, ja presente no historico completo.
      MEXERICA_CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      # Os testes de tunel SSH chamam /usr/bin/ssh de verdade; sem ele, 9 testes reprovam.
      - name: Garantir cliente ssh para os testes de tunel
        run: |
          if [ ! -x /usr/bin/ssh ]; then
            if [ "$(id -u)" = 0 ]; then apt-get update -qq && apt-get install -y -qq openssh-client; else sudo -n apt-get update -qq && sudo -n apt-get install -y -qq openssh-client; fi
          fi
          /usr/bin/ssh -V
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      # Inclui o gate de textos (traducao) e os testes de avisos de empacotamento.
      - run: npm test
      - name: Isolamento da variante Open (quando existir na arvore)
        run: npm run test:open --if-present

  # Checagem unica para a protecao da main: verde so quando todo job obrigatorio passou.
  ci-ok:
    name: ci-ok
    if: ${{ always() }}
    needs: [route, secrets, vazamento, semgrep, changes, ferramentas-ci, hub, desktop]
    runs-on: ${{ github.run_attempt == 1 && needs.route.outputs.light || 'instabox-small' }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Recusar fork sem executar codigo em runner de terceiro
        if: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          echo '::error::CI bloqueado para fork: nenhum codigo externo e executado nos provedores.'
          exit 1
      - name: Conferir resultado dos jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          if [ "$(jq -r '.changes.outputs.heavy' <<< "$NEEDS")" = false ] &&
            jq -e '.changes.outputs | .host == "true" or .desktop == "true"' > /dev/null <<< "$NEEDS"; then
            echo '::error::Testes pesados pendentes neste head. Marque o PR como pronto para executar a prova completa.'
          fi
          printf 'Resultados: %s\n' "$(jq -c 'with_entries(.value |= .result)' <<< "$NEEDS")" >> "$GITHUB_STEP_SUMMARY"
          jq -e '
            def selected($k): .changes.outputs[$k] == "true";
            def flag($k): .changes.outputs[$k] == "true" or .changes.outputs[$k] == "false";
            (.route.result == "success") and (.secrets.result == "success") and (.vazamento.result == "success") and
            (.semgrep.result == "success") and
            (.changes.result == "success") and (."ferramentas-ci".result == "success") and
            flag("host") and flag("desktop") and flag("heavy") and
            (if selected("host") then .hub.result == "success" else .hub.result == "skipped" end) and
            (if selected("desktop") then .desktop.result == "success" else .desktop.result == "skipped" end)
          ' > /dev/null <<< "$NEEDS"
