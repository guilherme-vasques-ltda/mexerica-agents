            *) echo "::error::Modo invalido: use release ou preview."; exit 1 ;;
          esac
          if [ "$RELEASE_MODE" = release ]; then
            test "${#RELEASE_VERSION}" -le 64 || { echo '::error::Versao longa demais (maximo 64 caracteres).'; exit 1; }
            [[ "$RELEASE_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|[0-9]*[a-z][a-z0-9]*)(\.((0|[1-9][0-9]*)|[0-9]*[a-z][a-z0-9]*))*)?$ ]] || { echo '::error::Versao invalida: use v0.0.1, sem zeros a esquerda, com sufixo opcional em minusculas (ex.: v0.0.1-rc.1).'; exit 1; }
            [[ "$RELEASE_VERSION" != *..* ]] || { echo '::error::Versao com trecho vazio entre pontos.'; exit 1; }
            [[ "$RELEASE_VERSION" != *-.* ]] || { echo '::error::Sufixo da versao nao pode comecar com ponto.'; exit 1; }
            [[ "$RELEASE_VERSION" != *. ]] || { echo '::error::Versao nao pode terminar com ponto.'; exit 1; }
            RELEASE_LABEL="$RELEASE_VERSION"
          else
            RELEASE_LABEL="preview-${GITHUB_SHA:0:12}"
          fi
          printf 'RELEASE_LABEL=%s\n' "$RELEASE_LABEL" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - name: Baixar os artefatos dos tres builds
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: gh run download "$RUN_ID" --repo "$REPO" -n release-macos-arm64 -n release-linux-amd64 -n release-windows-x64 -D "$RUNNER_TEMP/downloads"
      - name: Conferir hashes e montar a pasta da release
        run: |
          set -euo pipefail
          for par in release-macos-arm64/macos.sha256 release-linux-amd64/linux.sha256 release-windows-x64/windows.sha256; do
            test -f "$RUNNER_TEMP/downloads/$par" || { echo "::error::Artefato $par nao veio desta rodada."; exit 1; }
            (cd "$(dirname "$RUNNER_TEMP/downloads/$par")" && sha256sum -c "$(basename "$par")")
          done
          arquivos=(
            "release-macos-arm64/Mexerica-Open-${RELEASE_LABEL}-macos-arm64.zip"
            "release-linux-amd64/mexerica-open-${RELEASE_LABEL}-linux-amd64.deb"
            "release-linux-amd64/mexerica-open-${RELEASE_LABEL}-linux-x86_64.AppImage"
            "release-windows-x64/mexerica-open-${RELEASE_LABEL}-windows-x64-setup.exe"
            "release-windows-x64/mexerica-open-${RELEASE_LABEL}-windows-x64-portable.zip"
          )
          for rel in "${arquivos[@]}"; do
            caminho="$RUNNER_TEMP/downloads/$rel"
            if [ ! -f "$caminho" ] || [ -L "$caminho" ] || [ ! -s "$caminho" ]; then
              echo "::error::$rel nao e arquivo regular com conteudo."
              exit 1
            fi
          done
          assets="$RUNNER_TEMP/release-assets"
          mkdir -p "$assets"
          for rel in "${arquivos[@]}"; do
            cp "$RUNNER_TEMP/downloads/$rel" "$assets/"
          done
          (
            cd "$assets"
            sha256sum \
              "Mexerica-Open-${RELEASE_LABEL}-macos-arm64.zip" \
              "mexerica-open-${RELEASE_LABEL}-linux-amd64.deb" \
              "mexerica-open-${RELEASE_LABEL}-linux-x86_64.AppImage" \
              "mexerica-open-${RELEASE_LABEL}-windows-x64-setup.exe" \
              "mexerica-open-${RELEASE_LABEL}-windows-x64-portable.zip" \
              | LC_ALL=C sort -k2,2 > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
            cat SHA256SUMS.txt
          )
      - name: Publicar o resumo da previa
        if: ${{ inputs.mode == 'preview' }}
        run: |
          {
            echo 'Previa de build, nao e versao oficial: os arquivos ficam so nos artefatos do Actions, sem release, sem tag e sem publicacao.'
            printf 'Commit: %s\n' "$GITHUB_SHA"
            echo
            echo '```'
            cat "$RUNNER_TEMP/release-assets/SHA256SUMS.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ inputs.mode == 'preview' }}
        with:
          name: mexerica-open-preview-${{ github.sha }}
          path: ${{ runner.temp }}/release-assets/
          retention-days: 7
          if-no-files-found: error
      - name: Gerar as notas de lancamento
        if: ${{ inputs.mode == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: node tools/ci-release-notes.mjs --version "$RELEASE_VERSION" --sha "$GITHUB_SHA" --out "$RUNNER_TEMP/release-notes.md"
      # Fail-closed: tag existente ou release ja publicada encerra a rodada sem criar nada.
      - name: Recusar tag ou release ja existente e limpar rascunhos antigos
        if: ${{ inputs.mode == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/git/matching-refs/tags/$RELEASE_VERSION" | jq -s 'add // []' > "$RUNNER_TEMP/tags.json"
          if jq -e --arg ref "refs/tags/$RELEASE_VERSION" 'any(.[]; .ref == $ref)' > /dev/null "$RUNNER_TEMP/tags.json"; then
            echo "::error::A tag $RELEASE_VERSION ja existe; escolha outra versao."
            exit 1
          fi
          gh api --paginate "repos/$REPO/releases?per_page=100" | jq -s 'add // []' > "$RUNNER_TEMP/releases.json"
          if jq -e --arg tag "$RELEASE_VERSION" 'any(.[]; .tag_name == $tag and .draft == false)' > /dev/null "$RUNNER_TEMP/releases.json"; then
            echo "::error::Ja existe release publicada para $RELEASE_VERSION."
            exit 1
          fi
          for id in $(jq -r --arg tag "$RELEASE_VERSION" '.[] | select(.tag_name == $tag and .draft == true) | .id' "$RUNNER_TEMP/releases.json"); do
            gh api -X DELETE "repos/$REPO/releases/$id"
          done
      - name: Criar o rascunho da release (nunca publicar, nunca tag oficial)
        if: ${{ inputs.mode == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/release-assets"
          gh release create "$RELEASE_VERSION" --repo "$REPO" --draft --prerelease --target "$GITHUB_SHA" --title "Mexerica Open $RELEASE_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" \
            "$assets/Mexerica-Open-${RELEASE_LABEL}-macos-arm64.zip" \
            "$assets/mexerica-open-${RELEASE_LABEL}-linux-amd64.deb" \
            "$assets/mexerica-open-${RELEASE_LABEL}-linux-x86_64.AppImage" \
            "$assets/mexerica-open-${RELEASE_LABEL}-windows-x64-setup.exe" \
            "$assets/mexerica-open-${RELEASE_LABEL}-windows-x64-portable.zip" \
            "$assets/SHA256SUMS.txt"
      - name: Conferir o rascunho criado e registrar o resumo
        if: ${{ inputs.mode == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/releases?per_page=100" | jq -s 'add // []' > "$RUNNER_TEMP/releases.json"
          rascunho=$(jq -c --arg tag "$RELEASE_VERSION" '[.[] | select(.tag_name == $tag and .draft == true)] | .[0]' "$RUNNER_TEMP/releases.json")
          test "$rascunho" != 'null' || { echo "::error::Rascunho da versao $RELEASE_VERSION nao encontrado."; exit 1; }
          jq -e --arg sha "$GITHUB_SHA" '.draft == true and .prerelease == true and .target_commitish == $sha and (.assets | length) == 6' > /dev/null <<< "$rascunho" || { echo '::error::O rascunho nao saiu marcado como pre-lancamento com os seis arquivos.'; exit 1; }
          url=$(jq -r '.html_url' <<< "$rascunho")
          {
            printf 'Rascunho criado e nao publicado: %s\n' "$url"
            printf 'Versao: %s\nCommit: %s\n' "$RELEASE_VERSION" "$GITHUB_SHA"
            printf '\nSHA256SUMS.txt:\n\n'
            cat "$RUNNER_TEMP/release-assets/SHA256SUMS.txt"
          } >> "$GITHUB_STEP_SUMMARY"
