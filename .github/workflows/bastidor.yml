# Trava contra bastidor em titulo, descricao, branch e commits do PR. Guia: docs/guides/bastidor.md.
# So pull_request e sem checkout: o verificador e as regras vem da branch padrao pela API e nenhum codigo do PR roda.
# Titulo, descricao e commits sao lidos pela API a cada execucao, entao corrigir a descricao e rodar de novo basta.
name: Bastidor

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: bastidor-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  bastidor:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ vars.CI_MAQUINA_LEVE || 'instabox-small' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Recusar maquina do GitHub em repositorio privado
        if: ${{ runner.environment == 'github-hosted' && github.event.repository.private }}
        run: |
          echo '::error::Repositorio privado: este workflow nao roda em maquina do GitHub. Ajuste a variavel CI_MAQUINA_LEVE.'
          exit 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
      - name: Baixar o verificador e as regras da branch padrao
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/bastidor"
          mkdir -p "$dir"
          baixar() {
            curl --silent --show-error --location --max-time 30 -G \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw+json" -H "X-GitHub-Api-Version: 2022-11-28" \
              --data-urlencode "ref=$1" "$API_URL/repos/$REPO/contents/$2" -o "$3" -w '%{http_code}'
          }
          codigo=$(baixar "$DEFAULT_BRANCH" tools/ci-bastidor.mjs "$dir/ci-bastidor.mjs")
          ref="$DEFAULT_BRANCH"
          if [ "$codigo" = 404 ]; then
            # Somente no PR que introduz o verificador: a branch padrao ainda nao o tem.
            [[ "$PR_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
            ref="$PR_HEAD_SHA"
            codigo=$(baixar "$ref" tools/ci-bastidor.mjs "$dir/ci-bastidor.mjs")
          fi
          [ "$codigo" = 200 ]
          codigo=$(baixar "$ref" .github/security/bastidor.json "$dir/bastidor.json")
          [ "$codigo" = 200 ]
      - name: Verificar titulo, descricao, branch e commits
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASTIDOR_NOMES_INTERNOS: ${{ vars.BASTIDOR_NOMES_INTERNOS }}
        run: node "$RUNNER_TEMP/bastidor/ci-bastidor.mjs" pr --regras "$RUNNER_TEMP/bastidor/bastidor.json"
