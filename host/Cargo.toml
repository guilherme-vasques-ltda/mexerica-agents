# Modified from Codync v2.20.3 (Apache-2.0, github.com/leepokai/Codync); see MODIFICACOES.md.
[package]
name = "codync-host"
version = "0.1.0"
edition = "2024"
# let-chains (`if let … && let …`) need 1.88; rusqlite 0.43 needs 1.89.
rust-version = "1.89"
default-run = "donnabot-host"
description = "Runs your coding-agent bots and serves the Codync apps"
license = "Apache-2.0"
repository = "https://github.com/leepokai/Codync"
# Donnabot: o pacote mantém o nome do upstream, mas os binários se chamam donnabot-host(w), para o
# app, o SSH e os serviços nunca acharem nem rodarem o codync-host do Codync instalado.
autobins = false

[[bin]]
name = "donnabot-host"
path = "src/main.rs"

[[bin]]
name = "donnabot-motor-exec"
path = "src/bin/donnabot-motor-exec.rs"

[[bin]]
name = "donnabot-atualizar-privilegiado"
path = "src/bin/donnabot-atualizar-privilegiado.rs"

[[bin]]
name = "donnabot-guarda-atualizacao"
path = "src/bin/donnabot-guarda-atualizacao.rs"

[[bin]]
name = "donnabot-instalar-atualizacao"
path = "src/bin/donnabot-instalar-atualizacao.rs"

[[bin]]
name = "donnabot-motor-copia"
path = "src/bin/donnabot-motor-copia.rs"

[[bin]]
name = "donnabot-hostw"
path = "src/bin/codync-hostw.rs"

# The memory crate builds here and is mirrored to its own repository (docs/reference/memoria/bot-memory.md#packaging).
[workspace]
members = ["crates/memory", "crates/mail-read"]

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"

[dependencies]
aho-corasick = "1.1"
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
bzip2 = "0.6.1"
chacha20poly1305 = "0.11.0"
chrono = "0.4.45"
chrono-tz = "0.10.4"
codync-mem = { path = "crates/memory" }
clap = { version = "4.6.7", features = ["derive", "env"] }
croner = "3"
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "7.0.0"
ed25519-dalek = "3.0.0"
flate2 = "1.1.10"
fs2 = "0.4.3"
futures = "0.3.34"
gethostname = "1.1.0"
getrandom = "0.4"
hkdf = "0.13.0"
if-addrs = "0.15.0"
icu_properties = "2.3"
idna = "1.1"
lzma-rust2 = { version = "0.25.0", default-features = false, features = ["std", "xz"] }
portable-pty = "0.9.0"
qrcode = { version = "0.14.1", default-features = false }
regex = "1"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "form"] }
ring = "0.17"
rusqlite = { version = "0.43.0", features = ["bundled"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip"] }
serde_yaml_ng = "0.10.0"
sha2 = "0.11.0"
hmac = "0.13.0"
shlex = "2.0.1"
tar = "0.4.46"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-width = "0.2"
unicode-general-category = "1"
unicode-normalization = "0.1"
uuid = { version = "1.26.1", features = ["v4", "v7"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
zip = { version = "9.7.3", default-features = false, features = ["deflate-flate2", "bzip2"] }

zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust", "vendored"] }
dbus-secret-service = { version = "4.1.0", features = ["vendored"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Globalization",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
] }

# rust-skills lint-* rules: all default groups plus pedantic, with the
# library-oriented pedantic lints turned off for this binary crate.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
too_many_lines = "allow"
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"

# perf-release-profile / opt-lto-release. Unwinding stays on: a panic in one
# bot's task must not take down the whole daemon.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The host Codync Dev bundles (apps/desktop/tools/native-host.mjs): optimized like a release, but
# a host change rebuilds in about 25 s instead of 80 s per architecture.
[profile.dev-app]
inherits = "release"
lto = false
codegen-units = 16
incremental = true


[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
lzma-rust2 = { version = "0.25.0", default-features = false, features = ["std", "xz", "encoder"] }
tokio = { version = "1.53.1", features = ["test-util"] }
